<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cover for "Estación meteorológica".

  The same rules as the game's: drawn, not photographed, and SVG so it stays sharp and stays small.
  The picture is what the tool produces — a temperature line over a few days — rather than a picture
  of weather, because that is what somebody is choosing when they open it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img"
     aria-label="Gráfica de temperaturas sobre un cielo con sol y nubes">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2038" />
      <stop offset="100%" stop-color="#123049" />
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sky)" />

  <!-- Sun and cloud, small: the subject is the measurement, not the weather. -->
  <circle cx="522" cy="82" r="30" fill="#fbbf24" opacity=".9" />
  <g fill="#e2e8f0" opacity=".85">
    <circle cx="470" cy="104" r="22" />
    <circle cx="500" cy="98" r="26" />
    <circle cx="530" cy="106" r="20" />
    <rect x="468" y="104" width="64" height="20" rx="10" />
  </g>

  <!-- The reading, as the app shows it. -->
  <g fill="#f1f5f9" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="44" y="120" font-size="30" font-weight="600">Estación</text>
    <text x="44" y="158" font-size="30" font-weight="600">meteorológica</text>
    <text x="44" y="196" font-size="15" fill="#94a3b8">Mide, apunta, compara</text>
    <text x="44" y="268" font-size="54" font-weight="700">19°C</text>
    <text x="150" y="268" font-size="15" fill="#94a3b8">Vigo</text>
  </g>

  <!-- Seven days of temperature, the same shape the app draws from the reader's own notes. -->
  <g transform="translate(300 210)">
    <path d="M0 90 L0 62 L48 44 L96 52 L144 26 L192 34 L240 12 L288 22 L288 90 Z" fill="url(#under)" />
    <polyline points="0,62 48,44 96,52 144,26 192,34 240,12 288,22" fill="none" stroke="#38bdf8"
              stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <g fill="#38bdf8">
      <circle cx="0" cy="62" r="4" />
      <circle cx="48" cy="44" r="4" />
      <circle cx="96" cy="52" r="4" />
      <circle cx="144" cy="26" r="4" />
      <circle cx="192" cy="34" r="4" />
      <circle cx="240" cy="12" r="4" />
      <circle cx="288" cy="22" r="4" />
    </g>
    <line x1="-8" y1="98" x2="296" y2="98" stroke="#334155" stroke-width="2" />
  </g>
</svg>
