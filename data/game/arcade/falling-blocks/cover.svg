<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cover for "Bloques que caen".

  Drawn rather than photographed, and SVG rather than PNG, for three reasons that apply to any pack:
  it is a few hundred bytes instead of a few hundred kilobytes, it stays sharp on any screen and in
  print, and it can be read and edited — an author who wants their own colours changes six hex values.

  The picture is the game itself: the four pieces that matter, a gap in the stack, and the line about
  to be cleared. It says what the game is without a word of text, which is what a listing needs from a
  cover in a catalogue people scroll.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img"
     aria-label="Bloques de colores cayendo sobre una pila con un hueco">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#111a2e" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity=".55" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sky)" />

  <!-- The board, hinted with a grid rather than drawn in full. -->
  <g opacity=".16" stroke="#8ea3c7" stroke-width="1">
    <path d="M220 20V340M260 20V340M300 20V340M340 20V340M380 20V340M420 20V340" />
    <path d="M180 60H460M180 100H460M180 140H460M180 180H460M180 220H460M180 260H460M180 300H460" />
  </g>
  <rect x="180" y="20" width="280" height="320" rx="10" fill="none" stroke="#31415f" stroke-width="2" />

  <!-- Falling: an S piece and, above it, the I everyone is waiting for. -->
  <g>
    <rect x="260" y="60" width="36" height="36" rx="4" fill="#4ade80" />
    <rect x="300" y="60" width="36" height="36" rx="4" fill="#4ade80" />
    <rect x="220" y="100" width="36" height="36" rx="4" fill="#4ade80" />
    <rect x="260" y="100" width="36" height="36" rx="4" fill="#4ade80" />
  </g>
  <g opacity=".35">
    <rect x="340" y="20" width="36" height="36" rx="4" fill="#22d3ee" />
    <rect x="380" y="20" width="36" height="36" rx="4" fill="#22d3ee" />
  </g>

  <!-- The stack, with one gap left: the whole tension of the game in one missing square. -->
  <g>
    <rect x="180" y="260" width="36" height="36" rx="4" fill="#c084fc" />
    <rect x="220" y="260" width="36" height="36" rx="4" fill="#fb923c" />
    <rect x="260" y="260" width="36" height="36" rx="4" fill="#facc15" />
    <rect x="300" y="260" width="36" height="36" rx="4" fill="#60a5fa" />
    <rect x="380" y="260" width="36" height="36" rx="4" fill="#f87171" />
    <rect x="420" y="260" width="36" height="36" rx="4" fill="#c084fc" />

    <rect x="180" y="300" width="36" height="36" rx="4" fill="#60a5fa" />
    <rect x="220" y="300" width="36" height="36" rx="4" fill="#f87171" />
    <rect x="260" y="300" width="36" height="36" rx="4" fill="#4ade80" />
    <rect x="300" y="300" width="36" height="36" rx="4" fill="#facc15" />
    <rect x="340" y="300" width="36" height="36" rx="4" fill="#fb923c" />
    <rect x="380" y="300" width="36" height="36" rx="4" fill="#22d3ee" />
    <rect x="420" y="300" width="36" height="36" rx="4" fill="#60a5fa" />
  </g>

  <!-- The line about to go. -->
  <rect x="176" y="296" width="288" height="44" fill="url(#glow)" />

  <!-- The gap, outlined so the eye lands on it. -->
  <rect x="340" y="260" width="36" height="36" rx="4" fill="none" stroke="#22d3ee" stroke-width="2"
        stroke-dasharray="5 4" opacity=".9" />

  <g fill="#e8ecf5" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="150" font-size="42" font-weight="700">Bloques</text>
    <text x="40" y="196" font-size="42" font-weight="700">que caen</text>
    <text x="42" y="232" font-size="15" fill="#8ea3c7">Encaja las piezas · completa líneas</text>
  </g>
</svg>
