<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bloques que caen</title>
    <!--
      A standalone (tier C) Open Coach game.

      It runs in a sandboxed frame with an opaque origin and `connect-src 'none'`, so it has no network, no
      cookies and no access to the page around it. Everything it needs from the platform — the locale, the
      theme, the saved game, the score at the end — travels through the SDK, which is the only thing it is
      allowed to talk to.

      Styling reads the theme tokens the host sends, so the game follows the player's light or dark theme
      without knowing anything about the application.
    -->
    <script src="/games/sdk/v1.js"></script>
    <style>
      :root {
        --bg: #0b0f19;
        --fg: #e8ecf5;
        --muted: #97a1b5;
        --line: #263149;
        --accent: #4f8cff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        touch-action: manipulation;
      }
      #app {
        height: 100%;
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }
      canvas {
        background: #060911;
        border: 1px solid var(--line);
        border-radius: 10px;
        max-height: calc(100vh - 24px);
      }
      aside { min-width: 132px; display: flex; flex-direction: column; gap: 14px; }
      .box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
      .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
      .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .keys { font-size: 12px; color: var(--muted); line-height: 1.7; }
      kbd {
        border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
        padding: 0 5px; font-size: 11px; color: var(--fg);
      }
      button {
        font: inherit; color: var(--fg); background: transparent; cursor: pointer;
        border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
      }
      button:hover { border-color: var(--accent); }
      #over { position: fixed; inset: 0; display: none; place-items: center; background: rgba(6,9,17,.86); }
      #over.on { display: grid; }
      #over div { text-align: center; }
      #over p { margin: 6px 0 16px; color: var(--muted); }
      @media (max-width: 520px) {
        #app { flex-direction: column; gap: 10px; }
        aside { flex-direction: row; flex-wrap: wrap; justify-content: center; min-width: 0; }
        .keys { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="board" width="300" height="600" aria-label="Tablero"></canvas>
      <aside>
        <div class="box"><div class="label" id="l-score">Puntos</div><div class="value" id="score">0</div></div>
        <div class="box"><div class="label" id="l-best">Récord</div><div class="value" id="best">0</div></div>
        <div class="box"><div class="label" id="l-lines">Líneas</div><div class="value" id="lines">0</div></div>
        <div class="box"><div class="label" id="l-next">Siguiente</div><canvas id="next" width="96" height="96"></canvas></div>
        <div class="keys" id="keys">
          <kbd>←</kbd> <kbd>→</kbd> mover<br />
          <kbd>↑</kbd> girar · <kbd>↓</kbd> bajar<br />
          <kbd>espacio</kbd> soltar<br />
          <kbd>P</kbd> pausa
        </div>
        <button id="end">Terminar</button>
      </aside>
    </div>

    <div id="over"><div><h2 id="over-title">Fin de la partida</h2><p id="over-text"></p><button id="again">Jugar otra vez</button></div></div>

    <script src="./falling-blocks.js"></script>
  </body>
</html>
