<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bloques que caen</title>
    <!--
      A standalone (tier C) Open Coach app, and the reference one: everything it does, it does through
      the SDK, and it ships no dependency of its own.

      It runs in a sandboxed frame with an opaque origin, so it has no cookies and no access to the page
      around it, and its CSP allows only its own package and the shared kit. That is why the two links
      below are the only external things here: `kit.css` gives it the reader's theme, our controls and
      our icons, and `v1.js` is the SDK. Both are one cached file for every app on the platform.

      The board is SVG rather than a canvas. It costs nothing here — 200 cells, and only the ones that
      changed are touched — and it buys crisp scaling at any size, real focus outlines, and a board a
      screen reader can be told about.
    -->
    <link rel="stylesheet" href="/app/kit/v1/kit.css" />
    <script src="/app/sdk/v1.js"></script>
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
        touch-action: manipulation;
      }

      #app {
        height: 100%;
        display: flex;
        gap: 1rem;
        align-items: center;
        justify-content: center;
        padding: 0.75rem;
      }

      #board {
        height: min(100%, 78vh);
        max-width: 100%;
        border: 1px solid var(--coach-border);
        border-radius: var(--coach-radius);
        background: color-mix(in srgb, var(--coach-fg) 6%, var(--coach-bg));
      }

      aside {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        min-width: 9rem;
      }

      .label {
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--coach-muted);
      }

      .value {
        font-size: 1.4rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .keys {
        font-size: 0.75rem;
        color: var(--coach-muted);
        line-height: 1.8;
      }

      kbd {
        border: 1px solid var(--coach-border);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 0 0.3rem;
        font-size: 0.7rem;
        font-family: var(--coach-mono);
      }

      .row {
        display: flex;
        gap: 0.4rem;
      }

      .volume-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.1rem;
      }

      .volume-row input {
        flex: 1;
        min-width: 0;
        accent-color: var(--coach-accent);
      }

      .row .coach-button {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
      }

      #over {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: color-mix(in srgb, var(--coach-bg) 88%, transparent);
        backdrop-filter: blur(2px);
      }

      #over.on,
      #settings.on,
      #paused.on,
      #confirm.on {
        display: grid;
      }

      #confirm {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: color-mix(in srgb, var(--coach-bg) 86%, transparent);
        backdrop-filter: blur(2px);
      }

      #confirm .coach-panel {
        text-align: center;
        max-width: 20rem;
      }

      #confirm h2 {
        margin: 0 0 0.3rem;
        font-size: 1rem;
      }

      #confirm p {
        margin: 0 0 0.9rem;
        font-size: 0.85rem;
        color: var(--coach-muted);
      }

      #paused {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: color-mix(in srgb, var(--coach-bg) 78%, transparent);
        backdrop-filter: blur(2px);
        cursor: pointer;
      }

      #paused .coach-panel {
        text-align: center;
      }

      #paused h2 {
        margin: 0.25rem 0 0.25rem;
        font-size: 1.05rem;
      }

      #paused p {
        margin: 0;
        font-size: 0.85rem;
        color: var(--coach-muted);
      }

      #settings {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: color-mix(in srgb, var(--coach-bg) 88%, transparent);
        backdrop-filter: blur(2px);
      }

      #settings .coach-panel {
        min-width: 18rem;
        max-width: 22rem;
      }

      #settings h2 {
        margin: 0 0 0.75rem;
        font-size: 1.05rem;
      }

      .switch {
        display: flex;
        gap: 0.6rem;
        align-items: start;
        margin-bottom: 0.9rem;
        cursor: pointer;
      }

      .switch input {
        margin-top: 0.25rem;
        width: 1rem;
        height: 1rem;
        accent-color: var(--coach-accent);
      }

      .switch strong {
        display: block;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .slider {
        display: block;
        margin-bottom: 0.9rem;
      }

      .slider-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 0.3rem;
      }

      .slider-head span {
        font-weight: 400;
        font-size: 0.78rem;
        color: var(--coach-muted);
        font-variant-numeric: tabular-nums;
      }

      .slider input {
        width: 100%;
        accent-color: var(--coach-accent);
      }

      .switch em {
        display: block;
        font-style: normal;
        font-size: 0.78rem;
        color: var(--coach-muted);
      }

      .ranking {
        list-style: none;
        margin: 0 0 1rem;
        padding: 0;
        text-align: left;
        font-size: 0.85rem;
      }

      .ranking li {
        display: flex;
        gap: 0.6rem;
        padding: 0.25rem 0.4rem;
        border-radius: 6px;
      }

      .ranking li.you {
        background: color-mix(in srgb, var(--coach-accent) 18%, transparent);
        font-weight: 600;
      }

      .ranking .rank {
        width: 1.6rem;
        text-align: right;
        color: var(--coach-muted);
        font-variant-numeric: tabular-nums;
      }

      .ranking .name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ranking .score {
        font-variant-numeric: tabular-nums;
      }

      #over .coach-panel {
        text-align: center;
        min-width: 16rem;
      }

      #over h2 {
        margin: 0 0 0.25rem;
      }

      #over p {
        margin: 0 0 1rem;
        color: var(--coach-muted);
      }

      @media (max-width: 560px) {
        #app {
          flex-direction: column;
          gap: 0.6rem;
        }
        aside {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
          min-width: 0;
        }
        .keys {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 10 × 20 cells, each 30 units: the viewBox does the scaling, so there is no pixel arithmetic. -->
      <svg
        id="board"
        viewBox="0 0 300 600"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-label="Tablero de juego"
      ></svg>

      <aside>
        <div class="coach-panel">
          <div class="label" id="l-score">Puntos</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="coach-panel">
          <div class="label" id="l-best">Récord</div>
          <div class="value" id="best">0</div>
        </div>
        <div class="coach-panel">
          <div class="label" id="l-lines">Líneas</div>
          <div class="value" id="lines">0</div>
        </div>
        <div class="coach-panel">
          <div class="label" id="l-next">Siguiente</div>
          <svg id="next" viewBox="0 0 120 120" width="96" height="96" aria-hidden="true"></svg>
        </div>

        <div class="keys" id="keys">
          <kbd>←</kbd> <kbd>→</kbd> mover<br />
          <kbd>↑</kbd> girar · <kbd>↓</kbd> bajar<br />
          <kbd>espacio</kbd> soltar<br />
          <kbd>P</kbd> pausa
        </div>

        <!--
          The volume lives here rather than only in the settings panel: it is the control people reach
          for while playing, and a game you have to pause to quieten is a game you turn off instead.
        -->
        <label class="volume-row">
          <span class="coach-icon" data-icon="sound-on" id="sound-icon"></span>
          <input type="range" id="quick-volume" min="0" max="100" step="5" value="70" aria-label="Volumen" />
        </label>

        <div class="row">
          <button class="coach-button" id="pause" type="button">
            <span class="coach-icon" data-icon="pause" id="pause-icon"></span>
            <span id="pause-text">Pausa</span>
          </button>
          <button class="coach-button" id="restart" type="button" title="Reiniciar">
            <span class="coach-icon" data-icon="restart"></span>
            <span id="restart-text">Reiniciar</span>
          </button>
        </div>

        <div class="row">
          <button class="coach-button" id="settings-open" type="button">
            <span class="coach-icon" data-icon="save"></span>
            <span id="settings-open-text">Ajustes</span>
          </button>
          <button class="coach-button" id="end" type="button">
            <span class="coach-icon" data-icon="check"></span>
            <span id="end-text">Terminar</span>
          </button>
        </div>
      </aside>
    </div>

    <!--
      Settings, shown before the first game and reachable from the sound button afterwards.

      Two switches and no more. Sound is the one people want off, and the ghost piece is the one thing
      here worth turning off on a slow machine — it is a second pass over the board every frame. A
      settings panel with ten knobs would be a settings panel nobody reads.
    -->
    <div id="settings">
      <div class="coach-panel">
        <h2 id="settings-title">Antes de empezar</h2>

        <label class="switch">
          <input type="checkbox" id="opt-sound" checked />
          <span>
            <strong id="l-sound">Sonido</strong>
            <em id="l-sound-help">Efectos de movimiento, línea y fin de partida.</em>
          </span>
        </label>

        <label class="switch">
          <input type="checkbox" id="opt-music" checked />
          <span>
            <strong id="l-music">Música</strong>
            <em id="l-music-help">Una melodía de fondo mientras juegas.</em>
          </span>
        </label>

        <label class="slider">
          <span class="slider-head">
            <strong id="l-volume">Volumen</strong>
            <span id="volume-value">70%</span>
          </span>
          <input type="range" id="opt-volume" min="0" max="100" step="5" value="70" />
        </label>

        <label class="switch">
          <input type="checkbox" id="opt-ghost" checked />
          <span>
            <strong id="l-ghost">Sombra de la pieza</strong>
            <em id="l-ghost-help">Muestra dónde va a caer. Desactívala si el juego va lento.</em>
          </span>
        </label>

        <button class="coach-button coach-button--primary" id="settings-done" type="button">
          <span class="coach-icon" data-icon="play"></span>
          <span id="settings-done-text">Empezar</span>
        </button>
      </div>
    </div>

    <!-- Shown when the game is paused and the reader is looking at it: without this, a paused game is
         indistinguishable from a broken one. -->
    <div id="paused">
      <div class="coach-panel">
        <span class="coach-icon" data-icon="play" style="width: 2rem; height: 2rem"></span>
        <h2 id="paused-title">En pausa</h2>
        <p id="paused-help">Pulsa cualquier tecla para seguir.</p>
      </div>
    </div>

    <!--
      Asked here rather than with `confirm()`.

      A sandboxed frame without `allow-modals` ignores `alert`, `confirm` and `prompt` entirely — the
      call returns and nothing happens — so a game that asks that way silently does nothing. Keeping
      the sandbox tight and asking in the page is the right way round.
    -->
    <div id="confirm">
      <div class="coach-panel">
        <h2 id="confirm-title">¿Empezar una partida nueva?</h2>
        <p id="confirm-text">Se pierde la actual.</p>
        <div class="row" style="justify-content: center">
          <button class="coach-button coach-button--primary" id="confirm-yes" type="button">
            <span class="coach-icon" data-icon="restart"></span>
            <span id="confirm-yes-text">Reiniciar</span>
          </button>
          <button class="coach-button" id="confirm-no" type="button">
            <span class="coach-icon" data-icon="close"></span>
            <span id="confirm-no-text">Cancelar</span>
          </button>
        </div>
      </div>
    </div>

    <div id="over">
      <div class="coach-panel">
        <span class="coach-icon" data-icon="trophy" style="width: 2rem; height: 2rem"></span>
        <h2 id="over-title">Fin de la partida</h2>
        <p id="over-text"></p>

        <!-- Filled in after the score has been reported, so the reader sees where it left them. -->
        <ol id="ranking" class="ranking"></ol>
        <button class="coach-button coach-button--primary" id="again" type="button">
          <span class="coach-icon" data-icon="restart"></span>
          <span id="again-text">Jugar otra vez</span>
        </button>
      </div>
    </div>

    <script src="./falling-blocks.js"></script>
  </body>
</html>
