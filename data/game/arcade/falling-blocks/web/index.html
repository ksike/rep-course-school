<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bloques que caen</title>
    <!--
      A standalone (tier C) Open Coach app, and the reference one: everything it does, it does through
      the SDK, and it ships no dependency of its own.

      It runs in a sandboxed frame with an opaque origin, so it has no cookies and no access to the page
      around it, and its CSP allows only its own package and the shared kit. That is why the two links
      below are the only external things here: `kit.css` gives it the reader's theme, our controls and
      our icons, and `v1.js` is the SDK. Both are one cached file for every app on the platform.

      The board is SVG rather than a canvas. It costs nothing here — 200 cells, and only the ones that
      changed are touched — and it buys crisp scaling at any size, real focus outlines, and a board a
      screen reader can be told about.
    -->
    <link rel="stylesheet" href="/app/kit/v2/kit.css" />
    <script src="/app/sdk/v1.js"></script>
    <style>
      /*
        The app's own copy of the few values it needs.
        
        `kit.css` supplies these and the host overrides them with the reader's theme, but neither is
        guaranteed to arrive: a stale cached copy of the kit, or a host too old to serve it, used to
        leave the game on a black background with invisible text. Declaring them here means the worst
        case is "not themed", not "unreadable".
      */
      :root {
        --coach-bg: #0b1220;
        --coach-fg: #e8ecf5;
        --coach-muted: #8ea3c7;
        --coach-border: #263149;
        --coach-accent: #4f8cff;
        --coach-radius: 0.5rem;
        --coach-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      html,
      body {
        background: var(--coach-bg);
        color: var(--coach-fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        height: 100%;
        overflow: hidden;
        touch-action: manipulation;
      }

      /*
        Two thirds for the well, one for everything else.

        The panel used to be as narrow as it could be, which kept the figures cramped and pushed the
        controls into a column that ran out of room. Given a third of the width it can show the score,
        the next piece and the controls at a size somebody reads at a glance while playing.

        The panel is capped, because a third of an ultrawide screen is a third nobody needs: past that
        the extra goes back to the board, which is what people are looking at.
      */
      #app {
        height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
        align-items: center;
        gap: clamp(0.5rem, 2vw, 1.25rem);
        padding: clamp(0.4rem, 1.5vh, 0.9rem);
      }

      #board {
        height: 100%;
        max-height: 100%;
        width: auto;
        aspect-ratio: 1 / 2;
        justify-self: center;
        border: 1px solid var(--coach-border);
        border-radius: var(--coach-radius);
        background: color-mix(in srgb, var(--coach-fg) 6%, var(--coach-bg));
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--coach-accent) 12%, transparent);
        transition: box-shadow 0.25s;
      }

      /* A whole row cleared, and a level gained, are worth seeing as well as hearing. */
      #board.flash {
        box-shadow: 0 0 0 3px var(--coach-accent), 0 0 32px color-mix(in srgb, var(--coach-accent) 45%, transparent);
      }

      /*
        The panel scrolls rather than losing its end.

        On a short window the controls used to fall off the bottom with nothing to say so. A column
        that scrolls keeps every control reachable at any height, and the scrollbar is the hint.
      */
      aside {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        width: 100%;
        max-width: 24rem;
        justify-self: stretch;
        max-height: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;

        /* A surface of its own, so the side reads as "this is where the controls are" rather than as
           things floating beside the board. */
        border: 1px solid var(--coach-border);
        border-radius: calc(var(--coach-radius) * 1.5);
        background: color-mix(in srgb, var(--coach-fg) 4%, var(--coach-bg));
        padding: 0.7rem;
      }

      /* Each part of the panel says what it is; the rule is the boundary between them. */
      .panel-title {
        font-size: 0.62rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--coach-muted);
        margin: 0.25rem 0 -0.1rem;
      }

      .panel-title + * {
        margin-top: 0;
      }

      .panel-sep {
        height: 1px;
        background: var(--coach-border);
        margin: 0.15rem 0;
        border: 0;
      }

      /* Four small figures in two columns read faster than four stacked panels. */
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.4rem;
      }

      .stat {
        border: 1px solid var(--coach-border);
        border-radius: var(--coach-radius);
        padding: 0.4rem 0.5rem;
        background: color-mix(in srgb, var(--coach-fg) 3%, transparent);
      }

      .stat .label {
        font-size: clamp(0.6rem, 1vw, 0.7rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--coach-muted);
      }

      .stat .value {
        font-size: clamp(1.05rem, 2.2vw, 1.5rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
      }

      .stat--wide {
        grid-column: 1 / -1;
      }

      /* Progress to the next level: what "advancing" looks like while it is happening. */
      .level-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.4rem;
      }

      .level-bar {
        height: 5px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--coach-fg) 12%, transparent);
        overflow: hidden;
        margin-top: 0.35rem;
      }

      .level-bar span {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--coach-accent), color-mix(in srgb, var(--coach-accent) 40%, #fff));
        transition: width 0.35s ease;
      }

      .next-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        border: 1px solid var(--coach-border);
        border-radius: var(--coach-radius);
        padding: 0.4rem 0.5rem;
      }

      #next {
        width: clamp(3.6rem, 7vw, 5.2rem);
        height: clamp(3.6rem, 7vw, 5.2rem);
        flex: none;
      }

      /* Three columns, two rows: the arrow cluster as it is under somebody's hand. */
      .keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.3rem;
        justify-items: center;
      }

      .keycap--up {
        grid-column: 2;
        grid-row: 1;
      }

      .keycap--left {
        grid-column: 1;
        grid-row: 2;
      }

      .keycap--down {
        grid-column: 2;
        grid-row: 2;
      }

      .keycap--right {
        grid-column: 3;
        grid-row: 2;
      }

      .keyline {
        display: flex;
        gap: 0.3rem;
        margin-top: 0.3rem;
      }

      .keyline .keycap--wide {
        flex: 1;
      }

      .keycap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.15rem;
        width: 100%;
        padding: 0.3rem 0.2rem;
        border-radius: 8px;
        background: color-mix(in srgb, var(--coach-fg) 6%, transparent);
        border: 1px solid var(--coach-border);
        font-size: 0.58rem;
        color: var(--coach-muted);
        text-align: center;
      }

      .keycap kbd {
        font-family: var(--coach-mono);
        font-size: 0.8rem;
        line-height: 1;
        color: var(--coach-fg);
        border: 0;
        background: none;
        padding: 0;
      }

      /* Lit while the key is actually down: the panel answers, so it reads as the keyboard it draws. */
      .keycap.down {
        background: color-mix(in srgb, var(--coach-accent) 26%, transparent);
        border-color: var(--coach-accent);
        color: var(--coach-fg);
      }

      .row {
        display: flex;
        gap: 0.35rem;
      }

      .row .coach-button {
        flex: 1;
        min-width: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        padding: 0.5rem 0.6rem;
        font-size: clamp(0.8rem, 1.2vw, 0.9rem);
      }

      .row .coach-button span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .volume-row {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.1rem;
      }

      .volume-row input {
        flex: 1;
        min-width: 0;
        accent-color: var(--coach-accent);
      }

      /* ── overlays ───────────────────────────────────────────────────── */

      #over,
      #settings,
      #paused,
      #confirm {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: color-mix(in srgb, var(--coach-bg) 85%, transparent);
        backdrop-filter: blur(3px);
        padding: 1rem;
      }

      #over.on,
      #settings.on,
      #paused.on,
      #confirm.on {
        display: grid;
      }

      #paused {
        cursor: pointer;
      }

      #over .coach-panel,
      #settings .coach-panel,
      #paused .coach-panel,
      #confirm .coach-panel {
        text-align: center;
        max-width: min(24rem, 90vw);
        max-height: 88vh;
        overflow-y: auto;
        animation: rise 0.28s ease-out;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
      }

      #settings .coach-panel,
      #confirm .coach-panel {
        text-align: left;
      }

      #confirm .coach-panel {
        text-align: center;
      }

      h2 {
        margin: 0.25rem 0 0.3rem;
        font-size: 1.05rem;
      }

      #over p,
      #paused p,
      #confirm p {
        margin: 0 0 0.9rem;
        font-size: 0.86rem;
        color: var(--coach-muted);
      }

      /* Winning should look different, not only sound different. */
      #over.won .coach-panel {
        border-color: var(--coach-accent);
        box-shadow: 0 0 40px color-mix(in srgb, var(--coach-accent) 35%, transparent);
      }

      #confetti {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: none;
      }

      #confetti.on {
        display: block;
      }

      /* ── the two endings, and the good news in between ──────────────── */

      .figure {
        width: 6.5rem;
        height: 5rem;
        display: none;
        margin: 0 auto 0.25rem;
        color: var(--coach-fg);
      }

      .figure.on {
        display: block;
      }

      /* The winning stack grows into place; the star turns as it lands. */
      #fig-win .rise rect {
        transform-box: fill-box;
        transform-origin: bottom;
        animation: grow 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
      }

      #fig-win .rise rect:nth-child(2) {
        animation-delay: 0.12s;
      }

      #fig-win .rise rect:nth-child(3) {
        animation-delay: 0.24s;
      }

      #fig-win .spark {
        transform-box: fill-box;
        transform-origin: center;
        animation: pop 0.5s 0.36s ease-out both;
      }

      @keyframes grow {
        from {
          transform: scaleY(0);
        }
      }

      @keyframes pop {
        from {
          transform: scale(0) rotate(-90deg);
          opacity: 0;
        }
      }

      /* The losing stack tips over and settles. */
      #fig-lose .topple rect {
        transform-box: fill-box;
        transform-origin: bottom;
        animation: topple 0.6s ease-in both;
      }

      #fig-lose .topple rect:nth-child(2) {
        animation-delay: 0.08s;
      }

      #fig-lose .topple rect:nth-child(3) {
        animation-delay: 0.16s;
      }

      #fig-lose .down {
        animation: sink 0.7s 0.2s ease-in both;
      }

      @keyframes topple {
        to {
          transform: translateY(10px) rotate(14deg);
          opacity: 0.7;
        }
      }

      @keyframes sink {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
      }

      #levelup {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        pointer-events: none;
      }

      #levelup.on {
        display: grid;
      }

      .levelup-card {
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        color: var(--coach-bg);
        background: linear-gradient(90deg, var(--coach-accent), color-mix(in srgb, var(--coach-accent) 45%, #fff));
        box-shadow: 0 8px 30px color-mix(in srgb, var(--coach-accent) 45%, transparent);
        animation: banner 1.4s ease-out forwards;
      }

      .levelup-label {
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.85;
      }

      .levelup-value {
        font-size: 1.8rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      @keyframes banner {
        0% {
          opacity: 0;
          transform: scale(0.8);
        }
        18% {
          opacity: 1;
          transform: scale(1.04);
        }
        30% {
          transform: scale(1);
        }
        80% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateY(-14px);
        }
      }

      /* Somebody who asked for less movement gets the news without the movement. */
      @media (prefers-reduced-motion: reduce) {
        .figure * ,
        .levelup-card {
          animation: none !important;
        }
      }

      #confetti rect {
        animation: fall 1.9s linear forwards;
      }

      @keyframes fall {
        from {
          transform: translateY(-12%) rotate(0deg);
          opacity: 1;
        }
        to {
          transform: translateY(115%) rotate(540deg);
          opacity: 0;
        }
      }

      .ranking {
        list-style: none;
        margin: 0 0 1rem;
        padding: 0;
        text-align: left;
        font-size: 0.82rem;
      }

      .ranking li {
        display: flex;
        gap: 0.6rem;
        padding: 0.22rem 0.4rem;
        border-radius: 6px;
      }

      .ranking li.you {
        background: color-mix(in srgb, var(--coach-accent) 18%, transparent);
        font-weight: 600;
      }

      .ranking .rank {
        width: 1.5rem;
        text-align: right;
        color: var(--coach-muted);
        font-variant-numeric: tabular-nums;
      }

      .ranking .name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ranking .score {
        font-variant-numeric: tabular-nums;
      }

      .switch {
        display: flex;
        gap: 0.6rem;
        align-items: start;
        margin-bottom: 0.8rem;
        cursor: pointer;
      }

      .switch input {
        margin-top: 0.25rem;
        width: 1rem;
        height: 1rem;
        accent-color: var(--coach-accent);
      }

      .switch strong {
        display: block;
        font-size: 0.88rem;
        font-weight: 600;
      }

      .switch em {
        display: block;
        font-style: normal;
        font-size: 0.76rem;
        color: var(--coach-muted);
      }

      .slider {
        display: block;
        margin-bottom: 0.8rem;
      }

      .slider-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 0.88rem;
        font-weight: 600;
        margin-bottom: 0.3rem;
      }

      .slider-head span {
        font-weight: 400;
        font-size: 0.76rem;
        color: var(--coach-muted);
        font-variant-numeric: tabular-nums;
      }

      .slider input {
        width: 100%;
        accent-color: var(--coach-accent);
      }

      /* On a phone the panel goes under the board and lays itself out sideways. */
      @media (max-width: 620px), (max-height: 460px) {
        #app {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr) auto;
          align-items: stretch;
        }

        .panel-title,
        .panel-sep {
          display: none;
        }

        aside {
          width: 100%;
          max-width: none;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
          max-height: 9rem;
        }

        .stats {
          flex: 1;
          min-width: 11rem;
        }

        .keypad,
        .keyline {
          display: none;
        }

        .row {
          flex: 1;
          min-width: 9rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 10 × 20 cells, each 30 units: the viewBox does the scaling, so there is no pixel arithmetic. -->
      <svg
        id="board"
        viewBox="0 0 300 600"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-label="Tablero de juego"
      ></svg>

      <aside aria-label="Marcador y controles">
        <p class="panel-title" id="l-panel-stats">Partida</p>
        <div class="stats">
          <div class="stat">
            <div class="label" id="l-score">Puntos</div>
            <div class="value" id="score">0</div>
          </div>
          <div class="stat">
            <div class="label" id="l-best">Récord</div>
            <div class="value" id="best">0</div>
          </div>
          <div class="stat">
            <div class="label" id="l-lines">Líneas</div>
            <div class="value" id="lines">0</div>
          </div>
          <div class="stat">
            <div class="label" id="l-level">Nivel</div>
            <div class="value" id="level">1</div>
          </div>

          <div class="stat stat--wide">
            <div class="level-row">
              <span class="label" id="l-toNext">Al siguiente nivel</span>
              <span class="label" id="toNext">0/10</span>
            </div>
            <div class="level-bar"><span id="level-fill"></span></div>
          </div>
        </div>

        <div class="next-box">
          <span class="label" id="l-next">Siguiente</span>
          <svg id="next" viewBox="0 0 120 120" aria-hidden="true"></svg>
        </div>

        <hr class="panel-sep" />
        <p class="panel-title" id="l-panel-controls">Controles</p>

        <label class="volume-row">
          <span class="coach-icon" data-icon="sound-on" id="sound-icon"></span>
          <input type="range" id="quick-volume" min="0" max="100" step="5" value="70" aria-label="Volumen" />
        </label>

        <div class="row">
          <button class="coach-button" id="pause" type="button">
            <span class="coach-icon" data-icon="pause" id="pause-icon"></span>
            <span id="pause-text">Pausa</span>
          </button>
          <button class="coach-button" id="restart" type="button">
            <span class="coach-icon" data-icon="restart"></span>
            <span id="restart-text">Reiniciar</span>
          </button>
        </div>

        <div class="row">
          <button class="coach-button" id="settings-open" type="button">
            <span class="coach-icon" data-icon="save"></span>
            <span id="settings-open-text">Ajustes</span>
          </button>
          <button class="coach-button" id="end" type="button">
            <span class="coach-icon" data-icon="check"></span>
            <span id="end-text">Terminar</span>
          </button>
        </div>

        <hr class="panel-sep" />
        <p class="panel-title" id="l-panel-keys">Teclas</p>

        <!--
          The arrows as they sit on a keyboard, rather than a sentence about them.

          A list of names has to be read and translated into a shape; the shape *is* the answer, and
          somebody glancing at it while a piece is falling has no time for a sentence.
        -->
        <div class="keypad">
          <div class="keycap keycap--up"><kbd>↑</kbd><span id="k-rotate">girar</span></div>
          <div class="keycap keycap--left"><kbd>←</kbd><span id="k-left">izq.</span></div>
          <div class="keycap keycap--down"><kbd>↓</kbd><span id="k-down">bajar</span></div>
          <div class="keycap keycap--right"><kbd>→</kbd><span id="k-right">der.</span></div>
        </div>

        <div class="keyline">
          <span class="keycap keycap--wide"><kbd>espacio</kbd><span id="k-drop">soltar</span></span>
          <span class="keycap"><kbd>P</kbd><span id="k-pause">pausa</span></span>
        </div>
      </aside>
    </div>

    <svg id="confetti" aria-hidden="true"></svg>

    <!--
      Reaching a level is the only good news that happens mid-game, and it used to be a number quietly
      changing in the corner. It is a banner over the board for a second: it does not pause anything and
      it does not need dismissing, because interrupting somebody mid-piece to congratulate them is worse
      than saying nothing.
    -->
    <div id="levelup" aria-live="polite">
      <div class="levelup-card">
        <span class="levelup-label" id="levelup-label">Nivel</span>
        <span class="levelup-value" id="levelup-value">2</span>
      </div>
    </div>

    <div id="settings">
      <div class="coach-panel">
        <h2 id="settings-title">Antes de empezar</h2>

        <label class="switch">
          <input type="checkbox" id="opt-sound" checked />
          <span>
            <strong id="l-sound">Sonido</strong>
            <em id="l-sound-help">Efectos de movimiento, línea y fin de partida.</em>
          </span>
        </label>

        <label class="switch">
          <input type="checkbox" id="opt-music" checked />
          <span>
            <strong id="l-music">Música</strong>
            <em id="l-music-help">Una melodía de fondo mientras juegas.</em>
          </span>
        </label>

        <label class="slider">
          <span class="slider-head">
            <strong id="l-volume">Volumen</strong>
            <span id="volume-value">70%</span>
          </span>
          <input type="range" id="opt-volume" min="0" max="100" step="5" value="70" />
        </label>

        <label class="switch">
          <input type="checkbox" id="opt-ghost" checked />
          <span>
            <strong id="l-ghost">Sombra de la pieza</strong>
            <em id="l-ghost-help">Muestra dónde va a caer. Desactívala si el juego va lento.</em>
          </span>
        </label>

        <button class="coach-button coach-button--primary" id="settings-done" type="button">
          <span class="coach-icon" data-icon="play"></span>
          <span id="settings-done-text">Empezar</span>
        </button>
      </div>
    </div>

    <!--
      Asked here rather than with `confirm()`.

      A sandboxed frame without `allow-modals` ignores `alert`, `confirm` and `prompt` entirely — the
      call returns and nothing happens — so a game that asks that way silently does nothing.
    -->
    <div id="confirm">
      <div class="coach-panel">
        <h2 id="confirm-title">¿Empezar una partida nueva?</h2>
        <p id="confirm-text">Se pierde la actual.</p>
        <div class="row" style="justify-content: center">
          <button class="coach-button coach-button--primary" id="confirm-yes" type="button">
            <span class="coach-icon" data-icon="restart"></span>
            <span id="confirm-yes-text">Reiniciar</span>
          </button>
          <button class="coach-button" id="confirm-no" type="button">
            <span class="coach-icon" data-icon="close"></span>
            <span id="confirm-no-text">Cancelar</span>
          </button>
        </div>
      </div>
    </div>

    <div id="paused">
      <div class="coach-panel">
        <span class="coach-icon" data-icon="play" style="width: 2rem; height: 2rem"></span>
        <h2 id="paused-title">En pausa</h2>
        <p id="paused-help">Pulsa cualquier tecla para seguir.</p>
      </div>
    </div>

    <div id="over">
      <div class="coach-panel">
        <!--
          Two figures rather than two words. Whether it went well is the first thing somebody wants to
          know, and a shape says it before a sentence is read — the blocks stack up into a cup when it
          went well, and topple over the line when it did not.
        -->
        <svg id="fig-win" class="figure" viewBox="0 0 120 90" aria-hidden="true">
          <g class="rise">
            <rect x="30" y="46" width="16" height="16" rx="3" fill="#4ade80" />
            <rect x="52" y="34" width="16" height="28" rx="3" fill="#22d3ee" />
            <rect x="74" y="22" width="16" height="40" rx="3" fill="#facc15" />
          </g>
          <path class="spark" d="M60 6 L64 16 L74 18 L64 22 L60 32 L56 22 L46 18 L56 16 Z" fill="#facc15" />
          <line x1="22" y1="70" x2="98" y2="70" stroke="currentColor" stroke-width="2" opacity=".35" />
        </svg>

        <svg id="fig-lose" class="figure" viewBox="0 0 120 90" aria-hidden="true">
          <g class="topple">
            <rect x="30" y="44" width="16" height="16" rx="3" fill="#64748b" />
            <rect x="52" y="44" width="16" height="16" rx="3" fill="#64748b" />
            <rect x="74" y="44" width="16" height="16" rx="3" fill="#64748b" />
          </g>
          <!-- The line it did not clear. -->
          <line x1="22" y1="70" x2="98" y2="70" stroke="#f87171" stroke-width="3" stroke-dasharray="6 5" />
          <path class="down" d="M60 12 L60 34 M52 27 L60 35 L68 27" stroke="#f87171" stroke-width="3"
                fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <h2 id="over-title">Fin de la partida</h2>
        <p id="over-text"></p>

        <!-- Filled in after the score has been reported, so the reader sees where it left them. -->
        <ol id="ranking" class="ranking"></ol>

        <div class="row" style="justify-content: center">
          <button class="coach-button coach-button--primary" id="again" type="button">
            <span class="coach-icon" data-icon="restart"></span>
            <span id="again-text">Jugar otra vez</span>
          </button>
          <button class="coach-button" id="leave" type="button">
            <span class="coach-icon" data-icon="close"></span>
            <span id="leave-text">Salir</span>
          </button>
        </div>
      </div>
    </div>

    <script src="./falling-blocks.js"></script>
  </body>
</html>
